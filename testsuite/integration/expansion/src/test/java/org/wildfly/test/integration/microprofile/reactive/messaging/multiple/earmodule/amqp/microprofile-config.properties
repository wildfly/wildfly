amqp-port=${calculated.amqp.port}

# WFLY-22449 Use anycast ('queue' capability) so the broker creates a queue for the address when the sender attaches.
# Otherwise, the address is multicast and messages sent before the receiver attaches are dropped.
mp.messaging.outgoing.amqp.connector=smallrye-amqp
mp.messaging.outgoing.amqp.address=testing
mp.messaging.outgoing.amqp.capabilities=queue

mp.messaging.incoming.amqp-sink.connector=smallrye-amqp
mp.messaging.incoming.amqp-sink.address=testing
mp.messaging.incoming.amqp-sink.capabilities=queue
